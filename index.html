<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minería de Datos - INACAP Punta Arenas</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js para Exportar a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Nav -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="bg-red-600 text-white font-bold px-3 py-1 rounded text-sm tracking-wider">INACAP</span>
                <h1 class="text-lg font-semibold text-slate-200">Minería de Datos | Punta Arenas</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="btn-pdf" onclick="exportToPDF()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition duration-200 flex items-center gap-2 shadow">
                    <i class="fa-solid fa-file-pdf"></i> Descargar PDF Completo
                </button>
            </div>
        </div>
    </header>

    <!-- Content Viewport -->
    <main id="app-container" class="max-w-4xl mx-auto my-8 p-6 bg-slate-800 rounded-xl shadow-2xl border border-slate-700 flex-1 w-full min-h-[600px] flex flex-col justify-between">
        
        <!-- Paginador Header -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-6">
            <span id="page-tag" class="text-xs uppercase font-bold tracking-widest text-red-400">Módulo</span>
            <span id="page-indicator" class="text-sm font-mono bg-slate-900 px-3 py-1 rounded-full text-slate-400">Página 1 de 35</span>
        </div>

        <!-- Renderizado dinámico del contenido -->
        <div id="page-content" class="flex-1">
            <!-- El contenido JS se inyecta aquí -->
        </div>

        <!-- Paginador Footer / Nav Controls -->
        <div class="flex justify-between items-center border-t border-slate-700 pt-6 mt-6">
            <button id="btn-prev" onclick="prevPage()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-5 py-2.5 rounded-lg text-sm font-semibold transition duration-150 disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Anterior
            </button>
            
            <!-- Barra de Progreso General -->
            <div class="w-1/3 bg-slate-700 h-2 rounded-full overflow-hidden hidden sm:block">
                <div id="progress-bar" class="bg-red-600 h-full w-0 transition-all duration-300"></div>
            </div>

            <button id="btn-next" onclick="nextPage()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition duration-150 disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
                Siguiente <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-500 text-xs text-center py-4 border-t border-slate-800">
        <p>Ingeniería en Informática - INACAP Sede Punta Arenas &copy; 2026. Material Educativo de Procesamiento y Análisis de Datos.</p>
    </footer>

    <script src="assets/js/app.js"></script>
</body>
</html>
